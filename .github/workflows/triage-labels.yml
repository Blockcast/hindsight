name: Triage labels

# Labels new issues as core / integration (via Gemini).
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    # Upstream-only automation (needs the org's GEMINI_API_KEY).
    if: github.repository == 'vectorize-io/hindsight'
    runs-on: {group: default-tools, labels: arc-light}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/triage-labels.py ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
