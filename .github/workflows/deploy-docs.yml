name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'hindsight-docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 35
    runs-on: {group: default-tools, labels: arc-light}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # fetch tags so check-released-integrations can see them
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: ''
          package-manager-cache: false
          cache-dependency-path: package-lock.json
      - name: Restore Node cache
        id: docs-node-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
          save-cache: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
      - run: npm ci --workspace=hindsight-docs
      - run: uv run generate-llms-full
      - run: npm run build --workspace=hindsight-docs
        env:
          UMAMI_URL: https://analytics.hindsight.vectorize.io
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          # Unauthenticated, the github-stars plugin is rate limited (403) on shared runner IPs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Node cache
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'schedule') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.docs-node-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: hindsight-docs/build
  deploy:
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: {group: default-tools, labels: arc-light}
    needs: build
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
