name: Build custom image (fork)

# Dispatchable build of the api-only `hindsight-api` image for the Blockcast
# fork. Unlike release.yml (tag-triggered, also publishes PyPI/npm/helm under
# upstream @vectorize-io namespaces), this builds ONLY the container image for
# a chosen ref + tag and pushes it cosign-signed to GHCR. Used to ship fork
# patches (e.g. BLO-7608) to the on-prem cluster without a divergent release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build from (branch, tag, or full SHA)'
        required: true
        type: string
        default: 'main'
      image_tag:
        description: 'Image tag to push (e.g. 0.6.2-blo7608-11b41c03)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-api-image:
    name: Build & push hindsight-api (api-only) ${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute lowercase image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/hindsight-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (api-only, multi-arch)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/standalone/Dockerfile
          target: api-only
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.img.outputs.image }}:${{ inputs.image_tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published image
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/build-custom-image\.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
